# A small universal SwiftUI app, used to exercise Loupe against a real iOS app on
# both iPhone and iPad. It deliberately uses a NavigationSplitView, so the same
# build presents a sidebar on iPad and a push-navigation stack on iPhone — the
# cheapest way to have one app whose element tree genuinely differs by device.
name: TaskDemo
options:
  bundleIdPrefix: com.cocoanetics.loupe.examples
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TaskDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocoanetics.loupe.examples.taskdemo
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
